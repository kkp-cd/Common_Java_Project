trigger: none

pool:
  name: Azure_Project_VM

variables:
  SONARQUBE_HOST_URL: "http://52.234.35.11:9000"
  # SONARQUBE_TOKEN: $(Sonar-Token)
  SONARQUBE_TOKEN: squ_437664680ac09398422b376153585e3d2efd5a86
  SONAR_PROJECT_KEY: "Test-Sonar-$(Build.BuildId)"
  SONAR_PROJECT_NAME: "Test-Java-Sonar-$(Build.BuildId)"
  registry: sacdockerzure.azurecr.io
  frontendName: frontend
  backendName: backend

# Stage 1: Build, Scan & Publish Artifacts

stages:
  - stage: Build
    displayName: 'Build Scan and Publish Artifacts'
    jobs:
      - job: BuildJob
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: 'pom.xml'
              #mavenOptions: '-Xmx3072m'
              #publishJUnitResults: true
              #testResultsFiles: '**/surefire-reports/TEST-*.xml'
              goals: 'clean package -DskipTests=true'

          - task: SonarQubePrepare@7
            inputs:
              SonarQube: 'Sonar-AZD'
              scannerMode: 'Other'
              configMode: 'manual'
              cliProjectKey: '$(SONAR_PROJECT_KEY)'
              cliProjectName: '$(SONAR_PROJECT_NAME)'
              cliSources: '.'

          # --- DOWNLOAD, INSTALL, AND RUN SONARSCANNER CLI ON UBUNTU ---
          - script: |
              echo "Downloading SonarScanner CLI..."
              SCANNER_VERSION="5.0.1.3006"
              DOWNLOAD_URL="https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux.zip"
              INSTALL_PATH="$(Agent.TempDirectory)/sonar-scanner"

              # Download and unzip
              #  mkdir -p "$INSTALL_PATH"
              wget -q "$DOWNLOAD_URL" -O sonar-scanner.zip
              unzip -q sonar-scanner.zip -d "$INSTALL_PATH"

              # Find scanner directory and add to PATH
              SCANNER_DIR=$(find "$INSTALL_PATH" -type d -name "sonar-scanner-*")
              export PATH="$SCANNER_DIR/bin:$PATH"

              # echo "SonarScanner path: $SCANNER_DIR/bin"

              # Prevent branch analysis (Community Edition doesn’t support sonar.branch.name)
              sonar-scanner \
                -Dsonar.projectKey=$(SONAR_PROJECT_KEY) \
                -Dsonar.projectName=$(SONAR_PROJECT_NAME) \
                -Dsonar.sources=. \
                -Dsonar.java.binaries=. \
                -Dsonar.host.url=$(SONARQUBE_HOST_URL) \
                -Dsonar.login=$(SONARQUBE_TOKEN) \
                -Dsonar.branch.name=   # this line disables branch analysis
            displayName: 'Download, Install, and Run SonarScanner CLI on Ubuntu'

          - task: SonarQubePublish@7
            inputs:
              pollingTimeoutSec: '300'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'frontend/target'
              ArtifactName: 'frontend-drop'
              publishLocation: 'Container'
            displayName: 'Publish Frontend Artifact'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'backend/target'
              ArtifactName: 'backend-drop'
              publishLocation: 'Container'
            displayName: 'Publish Backend Artifact'

# Stage 2: Build & Push Docker Image

  - stage: Containerize
    displayName: 'Build and Push Docker Image'
    dependsOn: Build
    jobs:
      - job: DockerBuild
        steps:
          - checkout: none
          - task: Docker@2
            displayName: 'Build frontend and Push image to ACR'
            inputs:
              containerRegistry: 'ACR-SAC'       # Azure DevOps service connection name
              repository: '$(frontendName)'      # Repository name in ACR
              command: 'buildAndPush'
              Dockerfile: 'frontend/Dockerfile'
              tags: |
                $(Build.BuildId)
          - task: Docker@2
            displayName: 'Build backend and Push image to ACR'
            inputs:
              containerRegistry: 'ACR-SAC'       # Azure DevOps service connection name
              repository: '$(backendName)'      # Repository name in ACR
              command: 'buildAndPush'
              Dockerfile: 'backend/Dockerfile'
              tags: |
                $(Build.BuildId)


# Stage 3: Deploy to AKS with Ingress

  - stage: Deploy
    displayName: 'Deploy to AKS with Ingress'
    dependsOn: Containerize
    jobs:
      - job: DeployToAKS
        displayName: "Deploy Kubernetes manifests to AKS"
        steps:
          - checkout: none
          # Replace placeholders in YAMLs
          - script: |
              echo "Updating image tags in Kubernetes manifests..."
              sed -i "s|<IMAGE_TAG>|$(Build.BuildId)|g" k8s/frontend-deployment.yaml
              sed -i "s|<IMAGE_TAG>|$(Build.BuildId)|g" k8s/backend-deployment.yaml
              echo "YAML update complete."
            displayName: 'Inject image tag into manifests'

          # Apply manifests to AKS
          - task: Kubernetes@1
            displayName: 'Apply all manifests to AKS'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              #kubernetesServiceConnection: 'AKS-Connection-sac'   # your AKS service connection
              kubernetesServiceEndpoint: 'AKS-Connection-sac'
              azureResourceGroup: 'krishna-sachin'
              kubernetesCluster: 'aks-krishna-sachin'
              namespace: 'default'
              command: 'apply'
              useConfigurationFile: true
              configuration: |
                # k8s/namespace.yaml
                k8s/backend-deployment.yaml
                k8s/frontend-deployment.yaml
                k8s/ingress.yaml

