apiVersion: v1
kind: Namespace
metadata:
  name: java
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: java
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest 
          #image: $(frontend_IMAGE)   # Pipeline variable will replace this
          #image: myacrkrishnakiran2.azurecr.io/frontend:latest   # Replace with your ACR image
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: java
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 8084          #  external port (client/browser will use this)
    targetPort: 8080    #  internal container port (your app runs here)
  type: LoadBalancer