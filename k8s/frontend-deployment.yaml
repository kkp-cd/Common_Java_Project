apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  #namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: myacrkrishnasachin30.azurecr.io/frontend:latest
          ports:
            - containerPort: 8085
          env:
            - name: BACKEND
              value: http://backend-service:8086
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  #namespace: production
spec:
  selector:
    app: frontend
  ports:
    - port: 8085   # expose 8080
      targetPort: 8085
  type: ClusterIP
