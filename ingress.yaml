# This file is safe to deploy via Azure DevOps pipeline
# Prerequisite: ingress-nginx Helm chart already installed in cluster
# Access via the external IP assigned to ingress-nginx LoadBalancer

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-app-ingress
  namespace: java
  annotations:
    kubernetes.io/ingress.class: "nginx"  # Ensure NGINX handles this ingress
    #nginx.ingress.kubernetes.io/rewrite-target: /  # Optional: rewrite paths if needed
spec:
  ingressClassName: nginx
  rules:
    # Define HTTP routes
    #- host: "*"
    - http:    #note: this must be a list item (with "-")
        paths:
          # Frontend route
          - path: /
            pathType: Exact
            backend:
              service:
                name: frontend-service
                port:
                  number: 8085

          # Backend route
          - path: /docs
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 8086

  # Optional: add TLS if you have a certificate (skip if not)
  # tls:
  #   - hosts:
  #       - myapp.example.com
  #     secretName: myapp-tls-secret
